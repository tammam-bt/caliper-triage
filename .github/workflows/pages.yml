name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued rather than cancelled, so a push during a deploy
# does not leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the console
        # VITE_BASE must match the repository name: GitHub Pages serves a project site from
        # /<repo>/, and assets requested from / there 404 into a blank page.
        run: npm run build -w @caliper/web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Add SPA fallback
        # Pages has no rewrite rules. Serving index.html for unknown paths keeps a deep link or a
        # refresh from returning the 404 page.
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
