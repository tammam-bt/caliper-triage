name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        # The vision-LLM live test skips without a key, which is the intended CI behaviour.
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The official Playwright image ships the browsers and their system libraries. Installing them
    # on a bare runner meant an apt step that ran past eight minutes and then timed out; pinning
    # the image to the same version as the dependency removes that step entirely.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end tests
        run: npm run e2e -w @caliper/web
        env:
          CI: 'true'
          # Chromium refuses to start as root without this, and the container runs as root.
          PLAYWRIGHT_CHROMIUM_SANDBOX: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
